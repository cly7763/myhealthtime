<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyHealthTime - 헬스 & 피트니스 매니저</title>
  <meta name="description" content="운동 루틴 기록 및 건강 라이프 관리를 위한 스마트 웹 서비스" />

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f43f5e;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .auth-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-profile {
      display: none;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #f43f5e;
      object-fit: cover;
    }
    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .btn-logout {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-logout:hover {
      color: #f43f5e;
      border-color: #f43f5e;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
      width: 100%;
    }

    .landing-box {
      text-align: center;
      padding: 60px 20px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      margin-top: 20px;
    }
    .landing-box h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .landing-box p {
      font-size: 1.05rem;
      color: #94a3b8;
      max-width: 500px;
      margin: 0 auto 28px auto;
    }
    .google-btn-wrapper {
      display: flex;
      justify-content: center;
    }

    .dashboard {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dashboard-header {
      margin-bottom: 24px;
    }
    .dashboard-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
    }
    .dashboard-header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* 루틴 메인 카드 */
    .routine-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .routine-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 입력 폼 그리드 */
    .routine-form {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 24px;
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    @media (max-width: 768px) {
      .routine-form {
        grid-template-columns: 1fr 1fr;
      }
      .routine-form .btn-add {
        grid-column: span 2;
      }
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .form-group input, .form-group select {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #f43f5e;
    }
    .btn-add {
      background: #f43f5e;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      height: 38px;
    }
    .btn-add:hover {
      background: #e11d48;
    }

    /* 루틴 목록 테이블 */
    .table-container {
      overflow-x: auto;
    }
    .routine-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    .routine-table th {
      padding: 10px 14px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .routine-table td {
      padding: 14px;
      border-bottom: 1px solid #1e293b;
      color: #f1f5f9;
    }
    .routine-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #334155;
      color: #38bdf8;
    }
    .btn-delete {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-delete:hover {
      color: #f43f5e;
      border-color: #f43f5e;
    }
    .empty-msg {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid #1e293b;
      padding: 24px 20px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      background: #0b1120;
    }
    footer a {
      color: #94a3b8;
      text-decoration: none;
    }
    footer a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      <span>⏱️ MyHealthTime</span>
      <span class="logo-badge">FIT</span>
    </a>
    
    <div class="auth-container">
      <div class="user-profile" id="user-profile">
        <img src="" alt="Profile" class="user-avatar" id="user-avatar" />
        <span class="user-name" id="user-name"></span>
        <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="landing-box" id="landing-section">
      <h1>나만의 헬스 플래너, MyHealthTime</h1>
      <p>구글 로그인 후 실시간으로 운동 루틴을 클라우드에 저장하고 관리하세요.</p>
      <div class="google-btn-wrapper">
        <div id="google-main-btn"></div>
      </div>
    </section>

    <section class="dashboard" id="dashboard-section">
      <div class="dashboard-header">
        <h2 id="welcome-msg">환영합니다!</h2>
        <p>오늘의 운동 루틴을 등록하고 기록을 남겨보세요.</p>
      </div>

      <!-- 운동 루틴 관리 카드 -->
      <div class="routine-card">
        <h3>🏋️ 내 운동 루틴 설정</h3>

        <form class="routine-form" id="routine-form" onsubmit="handleAddRoutine(event)">
          <div class="form-group">
            <label>운동 종목</label>
            <input type="text" id="exercise-name" placeholder="예: 벤치프레스" required />
          </div>
          <div class="form-group">
            <label>운동 부위</label>
            <select id="target-body">
              <option value="가슴">가슴</option>
              <option value="등">등</option>
              <option value="하체">하체</option>
              <option value="어깨">어깨</option>
              <option value="팔">팔</option>
              <option value="복근/코어">복근/코어</option>
              <option value="유산소">유산소</option>
            </select>
          </div>
          <div class="form-group">
            <label>무게 (kg)</label>
            <input type="number" id="weight" step="0.5" placeholder="0" min="0" required />
          </div>
          <div class="form-group">
            <label>반복 (회)</label>
            <input type="number" id="reps" placeholder="10" min="1" required />
          </div>
          <div class="form-group">
            <label>세트</label>
            <input type="number" id="sets" placeholder="4" min="1" required />
          </div>
          <button type="submit" class="btn-add" id="btn-submit">추가</button>
        </form>

        <div class="table-container">
          <table class="routine-table">
            <thead>
              <tr>
                <th>부위</th>
                <th>운동 종목</th>
                <th>무게</th>
                <th>횟수</th>
                <th>세트</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="routine-list">
              <!-- 루틴 목록이 여기에 렌더링됩니다 -->
            </tbody>
          </table>
          <div id="empty-state" class="empty-msg">등록된 운동 루틴이 없습니다. 상단에서 추가해보세요!</div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MyHealthTime by DMK Studio. All rights reserved. | <a href="https://createdmk.com/">DMK Studio 홈</a></p>
  </footer>

  <script>
    // ⚙️ 1. 설정값 입력 (Supabase 및 Google Client ID)
    const SUPABASE_URL = "https://jlibqpijpmpqrehewoxn.supabase.co/rest/v1";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaWJxcGlqcG1wcXJlaGV3b3huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2OTcwNjYsImV4cCI6MjEwMzI3MzA2Nn0.8an1CTT1QFmedUeItbGN7XgMrepEwy3200HGnoXTUxs";
    const GOOGLE_CLIENT_ID = "784528740097-v1eob22oaigvrhrbgjmliag9pr5urse8.apps.googleusercontent.com";

    // Supabase 클라이언트 초기화
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    // JWT 파싱
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    // Google 로그인 응답 콜백
    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      if (payload) {
        currentUser = {
          id: payload.sub,
          name: payload.name,
          email: payload.email,
          picture: payload.picture
        };
        localStorage.setItem("mht_user", JSON.stringify(currentUser));
        renderAuthUI(currentUser);
        loadRoutines();
      }
    }

    // UI 상태 전환
    function renderAuthUI(user) {
      const landingSection = document.getElementById("landing-section");
      const dashboardSection = document.getElementById("dashboard-section");
      const userProfile = document.getElementById("user-profile");

      if (user) {
        landingSection.style.display = "none";
        dashboardSection.style.display = "block";
        userProfile.style.display = "flex";
        
        document.getElementById("user-name").textContent = user.name;
        document.getElementById("user-avatar").src = user.picture || "";
        document.getElementById("welcome-msg").textContent = `${user.name}님의 운동 루틴`;
      } else {
        landingSection.style.display = "block";
        dashboardSection.style.display = "none";
        userProfile.style.display = "none";
        renderGoogleButtons();
      }
    }

    // 로그아웃
    function handleLogout() {
      localStorage.removeItem("mht_user");
      currentUser = null;
      if (window.google && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
      renderAuthUI(null);
    }

    // Supabase: 루틴 목록 불러오기
    async function loadRoutines() {
      if (!currentUser) return;

      const { data, error } = await supabaseClient
        .from('workout_routines')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error("루틴 불러오기 실패:", error);
        return;
      }

      renderRoutineList(data || []);
    }

    // Supabase: 루틴 추가
    async function handleAddRoutine(e) {
      e.preventDefault();
      if (!currentUser) return;

      const exerciseName = document.getElementById("exercise-name").value.trim();
      const targetBody = document.getElementById("target-body").value;
      const weight = parseFloat(document.getElementById("weight").value) || 0;
      const reps = parseInt(document.getElementById("reps").value, 10) || 0;
      const sets = parseInt(document.getElementById("sets").value, 10) || 0;

      const btnSubmit = document.getElementById("btn-submit");
      btnSubmit.disabled = true;
      btnSubmit.textContent = "저장 중...";

      const { error } = await supabaseClient
        .from('workout_routines')
        .insert([
          {
            user_id: currentUser.id,
            exercise_name: exerciseName,
            target_body: targetBody,
            weight: weight,
            reps: reps,
            sets: sets
          }
        ]);

      btnSubmit.disabled = false;
      btnSubmit.textContent = "추가";

      if (error) {
        alert("루틴 저장에 실패했습니다.");
        console.error(error);
        return;
      }

      document.getElementById("routine-form").reset();
      loadRoutines();
    }

    // Supabase: 루틴 삭제
    async function handleDeleteRoutine(id) {
      if (!confirm("이 루틴을 삭제하시겠습니까?")) return;

      const { error } = await supabaseClient
        .from('workout_routines')
        .delete()
        .eq('id', id)
        .eq('user_id', currentUser.id);

      if (error) {
        alert("삭제에 실패했습니다.");
        console.error(error);
        return;
      }

      loadRoutines();
    }

    // 루틴 테이블 렌더링
    function renderRoutineList(routines) {
      const tbody = document.getElementById("routine-list");
      const emptyState = document.getElementById("empty-state");
      tbody.innerHTML = "";

      if (routines.length === 0) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      routines.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge">${item.target_body}</span></td>
          <td><strong>${item.exercise_name}</strong></td>
          <td>${item.weight} kg</td>
          <td>${item.reps} 회</td>
          <td>${item.sets} 세트</td>
          <td>
            <button class="btn-delete" onclick="handleDeleteRoutine('${item.id}')">삭제</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 구글 버튼 렌더
    function renderGoogleButtons() {
      if (window.google && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false
        });

        google.accounts.id.renderButton(
          document.getElementById("google-main-btn"),
          { theme: "filled_blue", size: "large", text: "continue_with", shape: "pill" }
        );
      }
    }

    // 초기화
    window.onload = function () {
      const savedUser = localStorage.getItem("mht_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        renderAuthUI(currentUser);
        loadRoutines();
      } else {
        const checkGsi = setInterval(() => {
          if (window.google && google.accounts.id) {
            clearInterval(checkGsi);
            renderGoogleButtons();
          }
        }, 100);
      }
    };
  </script>
</body>
</html>
